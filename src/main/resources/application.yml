spring:
  application:
    name: evidence-vault
  config:
    # Git-ignored per-machine overrides; see application-local.properties.example
    import: optional:file:./application-local.properties
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evidence_vault}
    username: ${DB_USERNAME:ev}
    password: ${DB_PASSWORD:ev}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
